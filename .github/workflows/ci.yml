name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - run: gem install --no-document cookstyle
      - run: cookstyle --display-cop-names
      - run: shellcheck -s sh files/es-python-fleet-install.sh
